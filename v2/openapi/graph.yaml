openapi: 3.0.3
info:
  title: rig graph service
  version: 0.1.0
  description: >
    Expeditions/waypoints graph API: one effort (an expedition) to turn a
    loose idea into a destination, made of waypoints (questions) driven
    through sighted -> marked -> claimed -> reached | bypassed, linked by
    dependency edges and expedition-spurring lineage. Ported from v1's
    discovery Postgres schema (.meta/spec/db/schema.sql, originally
    "trails"); implemented against Neo4j.
servers:
  - url: http://localhost:8789

paths:
  /expeditions:
    post:
      summary: Create an expedition
      operationId: createExpedition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpeditionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      summary: List expeditions for a workspace
      operationId: listExpeditions
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ExpeditionStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expedition" }

  /expedition-by-spec/{specId}:
    get:
      summary: Get the expedition linked to a spec (at most one per spec)
      operationId: getExpeditionBySpec
      parameters:
        - name: specId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{id}:
    get:
      summary: Get an expedition
      operationId: getExpedition
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update an expedition's title/destination/notes
      operationId: updateExpedition
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExpeditionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{id}/complete:
    post:
      summary: Complete an expedition with an outcome
      operationId: completeExpedition
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteExpeditionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{id}/abandon:
    post:
      summary: Abandon an expedition
      operationId: abandonExpedition
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{id}/reopen:
    post:
      summary: Reopen a completed or abandoned expedition
      operationId: reopenExpedition
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{id}/lineage:
    get:
      summary: Get an expedition's parent edge (chartering session or spurring waypoint)
      operationId: getExpeditionLineage
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpeditionLineage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{expeditionId}/waypoints:
    post:
      summary: Add a waypoint to an expedition
      operationId: addWaypoint
      parameters: [ { $ref: "#/components/parameters/ExpeditionIdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWaypointRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List an expedition's waypoints in waypoint-number order
      operationId: listWaypoints
      parameters: [ { $ref: "#/components/parameters/ExpeditionIdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Waypoint" }

  /expeditions/{expeditionId}/waypoints/frontier:
    get:
      summary: >
        Get the frontier: marked waypoints whose blockers have all
        terminated (reached or bypassed).
      operationId: getFrontier
      parameters: [ { $ref: "#/components/parameters/ExpeditionIdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Waypoint" }

  /waypoints/{id}:
    get:
      summary: Get a waypoint
      operationId: getWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a waypoint's title/question/approach
      operationId: updateWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWaypointRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }

  /waypoints/{id}/claim:
    post:
      summary: Atomically claim a marked waypoint
      operationId: claimWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimedBy]
              properties:
                claimedBy: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "409":
          description: Already claimed, or not in a claimable status
        "404": { $ref: "#/components/responses/NotFound" }

  /waypoints/{id}/release:
    post:
      summary: Release a claimed waypoint back to marked
      operationId: releaseWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }

  /waypoints/{id}/reach:
    post:
      summary: Reach a waypoint (record its resolution)
      operationId: reachWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReachWaypointRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }

  /waypoints/{id}/bypass:
    post:
      summary: Bypass a waypoint (consciously route around it)
      operationId: bypassWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }

  /waypoints/{id}/unbypass:
    post:
      summary: Restore a bypassed waypoint to its previous status
      operationId: unbypassWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Waypoint is not bypassed

  /waypoints/{id}/rehydrate:
    post:
      summary: >
        Redo a reached or bypassed waypoint's decision: snapshots the
        current terminal state to history (nothing deleted), then sets it
        to rehydrating. Legal only when the owning expedition is active.
      operationId: rehydrateWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Waypoint" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Waypoint is not reached/bypassed, or the owning expedition is not active

  /waypoints/{id}/history:
    get:
      summary: List a waypoint's append-only history of superseded terminal states, oldest first
      operationId: listWaypointHistory
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaypointHistoryEntry" }

  /waypoints/{id}/flags:
    post:
      summary: Raise a non-mutating marker that this waypoint's decision may need reconsidering
      operationId: flagWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagWaypointRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List every flag (resolved and unresolved) targeting this waypoint
      operationId: listWaypointFlags
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Flag" }

  /flags/{id}/resolve:
    post:
      summary: Mark a flag resolved, without deleting the flag record
      operationId: resolveWaypointFlag
      parameters: [ { $ref: "#/components/parameters/FlagId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flag" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expeditions/{id}/flags:
    get:
      summary: List unresolved flags targeting any of this expedition's waypoints (incoming only)
      operationId: listUnresolvedExpeditionFlags
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Flag" }

  /waypoints/{id}/assets:
    post:
      summary: >
        Attach an asset to a waypoint: what resolving it produced. Exactly
        one of contentMarkdown/repoPath. Unguarded — legal regardless of
        the waypoint's current status.
      operationId: addWaypointAsset
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWaypointAssetRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List a waypoint's assets, oldest first
      operationId: listWaypointAssets
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Asset" }

  /expeditions/{id}/terms:
    post:
      summary: Pin a piece of terminology to an expedition. Rejects a case-insensitive duplicate term.
      operationId: addExpeditionTerm
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExpeditionTermRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Term" }
        "409":
          description: A term with this text already exists on this expedition (case-insensitive)
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List an expedition's terms
      operationId: listExpeditionTerms
      parameters: [ { $ref: "#/components/parameters/ExpeditionId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Term" }

  /terms/{id}:
    patch:
      summary: Correct a term's definition. The term text itself is fixed once added.
      operationId: updateExpeditionTerm
      parameters: [ { $ref: "#/components/parameters/TermId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExpeditionTermRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Term" }
        "404": { $ref: "#/components/responses/NotFound" }

  /waypoints/{id}/spur:
    post:
      summary: Spin a new expedition off this waypoint's resolution
      operationId: spurWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpurWaypointRequest" }
      responses:
        "201":
          description: Created. The origin waypoint is reached in the same call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expedition" }
        "409":
          description: Waypoint already spurred an expedition, or is not marked/claimed
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a waypoint's spur lineage edge (child expedition is untouched)
      operationId: unspurWaypoint
      parameters: [ { $ref: "#/components/parameters/WaypointId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: No Content }

  /expeditions/{expeditionId}/waypoint-dependencies:
    get:
      summary: List every dependency edge between two waypoints of this expedition
      operationId: listWaypointDependencies
      parameters: [ { $ref: "#/components/parameters/ExpeditionIdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaypointDependencyEdge" }

  /waypoint-dependencies:
    post:
      summary: Add a dependency edge (fromWaypointId must terminate before toWaypointId is frontier-eligible)
      operationId: addWaypointDependency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaypointDependencyRequest" }
      responses:
        "204": { description: No Content }
        "409":
          description: Same waypoint, or from/to belong to different expeditions
    delete:
      summary: Remove a dependency edge
      operationId: removeWaypointDependency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaypointDependencyRequest" }
      responses:
        "204": { description: No Content }

  # Spec pipeline — read/lifecycle + approve/deny only. Every per-artifact
  # CRUD operation (user stories, design components, task items, ...) has a
  # full mcp__rig__* tool equivalent instead (see mcpserver/spec.go and
  # spec-pipeline-graph.md at the repo root) — mirroring all of it here
  # would duplicate an already-tested surface for a REST client that, today,
  # doesn't exist. Approve/deny have no MCP tool at all (human-only, per
  # .meta/spec/README.md) and need this as their one interface.
  /specs:
    get:
      summary: List specs for a workspace
      operationId: listSpecs
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Spec" }

  /specs/{id}:
    get:
      summary: Get one spec, including derived tasksStageStatus
      operationId: getSpec
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spec" }
        "404": { $ref: "#/components/responses/NotFound" }

  /specs/{id}/next-stage:
    get:
      summary: Get which stage to work on next, and any lagging components once tasks is active
      operationId: getNextStage
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextStageInfo" }
        "404": { $ref: "#/components/responses/NotFound" }

  /specs/{id}/tasks-docs:
    get:
      summary: >-
        List a spec's per-component task docs, so a client can discover the component slugs
        render/finalize/approve/deny require. Note: a nonexistent spec id returns 200 with an
        empty list rather than 404 — the underlying store query (shared with
        /render?stage=tasks) doesn't check spec existence, only matches component docs.
      operationId: listTasksDocs
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListTasksDocsResponse" }

  /specs/{id}/render:
    get:
      summary: Render a stage's markdown from live graph state — there is no stored document
      operationId: renderDocument
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
        - name: stage
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SpecStage" }
        - name: component
          in: query
          required: false
          description: 'Tasks stage only: a component slug, or "all" for the index'
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderDocumentResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /specs/{id}/finalize:
    post:
      summary: Submit a stage's draft for review (status -> in_review); blocked by unresolved open questions and that stage's own completeness gate
      operationId: finalizeStage
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageActionResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /specs/{id}/approve:
    post:
      summary: Approve a stage (in_review -> approved). Human-only — no MCP tool equivalent.
      operationId: approveStage
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageActionResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /specs/{id}/deny:
    post:
      summary: Deny a stage (in_review -> not_started, destructive — content untouched, no history kept). Human-only — no MCP tool equivalent.
      operationId: denyStage
      parameters:
        - { $ref: "#/components/parameters/SpecId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageActionResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /handoffs:
    get:
      summary: List handoffs for a workspace
      operationId: listHandoffs
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [inbound, outbound, both] }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoffs:
                    type: array
                    items: { $ref: "#/components/schemas/Handoff" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /handoffs/{id}:
    get:
      summary: Get a handoff with its full body and attachments
      operationId: getHandoff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Handoff" }
        "404": { $ref: "#/components/responses/NotFound" }

  /handoffs/{id}/conversation:
    get:
      summary: Get a handoff conversation and its turns
      operationId: getHandoffConversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/HandoffConversation" }
                  turns:
                    type: array
                    items: { $ref: "#/components/schemas/HandoffTurn" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    ExpeditionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExpeditionIdPath:
      name: expeditionId
      in: path
      required: true
      schema: { type: string }
    WaypointId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SpecId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FlagId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TermId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >
        A stage/state-transition rule rejected this action — e.g. an
        unresolved open question, an incomplete stage, an orphaned tasks
        doc, or a task-dependency cycle.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    ExpeditionStatus:
      type: string
      enum: [active, complete, abandoned]

    ExpeditionOutcomeKind:
      type: string
      enum: [spec, decision, change]

    WaypointStatus:
      type: string
      enum: [sighted, marked, claimed, reached, bypassed]

    WaypointApproach:
      type: string
      enum: [grilling, research, prototype, task]

    LineageParentKind:
      type: string
      enum: [session, waypoint]

    Expedition:
      type: object
      required: [id, workspaceId, slug, title, briefingPrompt, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        title: { type: string }
        briefingPrompt: { type: string }
        destination: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ExpeditionStatus" }
        outcomeKind: { allOf: [ { $ref: "#/components/schemas/ExpeditionOutcomeKind" } ], nullable: true }
        outcomeSpecId: { type: string, nullable: true }
        outcomeSummary: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        reopenReason: { type: string, nullable: true, description: Why reopen_expedition was last called, if ever. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateExpeditionRequest:
      type: object
      required: [workspaceId, slug, title, briefingPrompt]
      properties:
        workspaceId: { type: string }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        title: { type: string }
        briefingPrompt: { type: string }
        destination: { type: string }
        notes: { type: string }
        sessionId: { type: string }

    SpurWaypointRequest:
      type: object
      required: [workspaceId, slug, title, briefingPrompt]
      properties:
        workspaceId: { type: string }
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        title: { type: string }
        briefingPrompt: { type: string }
        destination: { type: string }
        notes: { type: string }
        rationale:
          type: string
          description: Recorded on the origin waypoint's reach, same as ReachWaypointRequest.rationale.
        reachedIn:
          type: string
          description: Recorded on the origin waypoint's reach, same as ReachWaypointRequest.reachedIn.

    UpdateExpeditionRequest:
      type: object
      properties:
        title: { type: string }
        destination: { type: string }
        notes: { type: string }

    CompleteExpeditionRequest:
      type: object
      required: [outcomeKind]
      properties:
        outcomeKind: { $ref: "#/components/schemas/ExpeditionOutcomeKind" }
        outcomeSummary:
          type: string
          description: Required for outcomeKind decision/change.
        specSlug:
          type: string
          description: 'Required when outcomeKind is "spec": kebab-case slug for the new spec.'
        featureName:
          type: string
          description: 'Required when outcomeKind is "spec": the spec''s feature name.'

    ExpeditionLineage:
      type: object
      required: [childExpeditionId, parentKind]
      properties:
        childExpeditionId: { type: string }
        parentKind: { $ref: "#/components/schemas/LineageParentKind" }
        parentSessionId: { type: string, nullable: true }
        parentWaypointId: { type: string, nullable: true }

    Waypoint:
      type: object
      required: [id, expeditionId, waypointNumber, title, question, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        expeditionId: { type: string }
        waypointNumber: { type: integer }
        title: { type: string }
        question: { type: string }
        approach: { allOf: [ { $ref: "#/components/schemas/WaypointApproach" } ], nullable: true }
        status: { $ref: "#/components/schemas/WaypointStatus" }
        claimedBy: { type: string, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
        resolution: { type: string, nullable: true }
        resolutionGist: { type: string, nullable: true }
        rationale: { type: string, nullable: true }
        bypassReason: { type: string, nullable: true }
        unbypassReason: { type: string, nullable: true, description: Why unbypass_waypoint was last called, if ever; nulled by a subsequent bypass. }
        unspurReason: { type: string, nullable: true, description: Why unspur_waypoint was last called, if ever; nulled by a subsequent spur. }
        previousStatus: { allOf: [ { $ref: "#/components/schemas/WaypointStatus" } ], nullable: true }
        reachedIn: { type: string, nullable: true }
        reachedAt: { type: string, format: date-time, nullable: true }
        spurredToExpeditionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddWaypointRequest:
      type: object
      required: [title, question]
      properties:
        title: { type: string }
        question: { type: string }
        approach: { $ref: "#/components/schemas/WaypointApproach" }
        resolution:
          type: string
          description: Set together with resolutionGist to insert directly at "reached" (grilling's inline-reach case).
        resolutionGist: { type: string }
        reachedIn: { type: string }

    UpdateWaypointRequest:
      type: object
      properties:
        title: { type: string }
        question: { type: string }
        approach: { $ref: "#/components/schemas/WaypointApproach" }

    ReachWaypointRequest:
      type: object
      required: [resolution, resolutionGist]
      properties:
        resolution: { type: string }
        resolutionGist: { type: string }
        rationale: { type: string }
        reachedIn: { type: string }

    WaypointDependencyRequest:
      type: object
      required: [fromWaypointId, toWaypointId]
      properties:
        fromWaypointId:
          type: string
          description: Must terminate (reached or bypassed) before toWaypointId is frontier-eligible.
        toWaypointId: { type: string }

    WaypointDependencyEdge:
      type: object
      properties:
        fromWaypointId: { type: string }
        toWaypointId: { type: string }
        createdAt: { type: string, format: date-time }

    ReasonRequest:
      type: object
      required: [reason]
      description: Shared shape for reopen_expedition, unbypass_waypoint, unspur_waypoint, rehydrate_waypoint, resolve_waypoint_flag.
      properties:
        reason: { type: string }

    WaypointHistoryEntry:
      type: object
      required: [id, waypointId, ordinal, sourceStatus, reason, supersededAt, createdAt]
      description: >
        An append-only snapshot of a waypoint's terminal state, taken by
        rehydrate_waypoint immediately before a redo overwrites the live
        fields. Nothing about a waypoint's prior resolution or bypass
        reason is ever deleted — it moves here instead.
      properties:
        id: { type: string }
        waypointId: { type: string }
        ordinal: { type: integer }
        sourceStatus:
          type: string
          enum: [reached, bypassed]
          description: The status this snapshot superseded.
        resolution: { type: string, nullable: true }
        resolutionGist: { type: string, nullable: true }
        rationale: { type: string, nullable: true }
        reachedIn: { type: string, nullable: true }
        reachedAt: { type: string, format: date-time, nullable: true }
        bypassReason: { type: string, nullable: true }
        reason:
          type: string
          description: The reason passed to rehydrate_waypoint.
        supersededAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Flag:
      type: object
      required: [id, targetWaypointId, note, raisedAt, resolved]
      description: >
        A non-mutating marker that a waypoint's decision may need
        reconsidering. Never deleted, only resolved.
      properties:
        id: { type: string }
        targetWaypointId: { type: string }
        sourceWaypointId:
          type: string
          nullable: true
          description: The waypoint whose decision motivated this flag, if any — optional, since a flag can be raised narratively.
        note: { type: string }
        raisedAt: { type: string, format: date-time }
        resolved: { type: boolean }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedReason: { type: string, nullable: true }

    FlagWaypointRequest:
      type: object
      required: [note]
      properties:
        note: { type: string }
        sourceWaypointId: { type: string }

    Asset:
      type: object
      required: [id, waypointId, ordinal, kind, title, createdAt]
      description: >
        What resolving a waypoint produced. Exactly one of
        contentMarkdown/repoPath is set per asset.
      properties:
        id: { type: string }
        waypointId: { type: string }
        ordinal: { type: integer }
        kind:
          type: string
          description: 'Open set, e.g. research_summary, analysis, prototype_ref.'
        title: { type: string }
        contentMarkdown:
          type: string
          nullable: true
          description: Documents stored whole; exactly one of contentMarkdown/repoPath.
        repoPath:
          type: string
          nullable: true
          description: Prototype code committed to main; exactly one of contentMarkdown/repoPath.
        commitSha: { type: string, nullable: true, description: Only meaningful alongside repoPath. }
        createdAt: { type: string, format: date-time }

    AddWaypointAssetRequest:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string }
        title: { type: string }
        contentMarkdown: { type: string }
        repoPath: { type: string }
        commitSha: { type: string }

    Term:
      type: object
      required: [id, expeditionId, term, definition]
      description: A piece of terminology pinned down while walking an expedition. Per-expedition, not a workspace-level glossary.
      properties:
        id: { type: string }
        expeditionId: { type: string }
        term: { type: string }
        definition: { type: string }

    AddExpeditionTermRequest:
      type: object
      required: [term, definition]
      properties:
        term: { type: string }
        definition: { type: string }

    UpdateExpeditionTermRequest:
      type: object
      required: [definition]
      description: Only the definition is updatable; the term text itself is fixed once added.
      properties:
        definition: { type: string }

    SpecStage:
      type: string
      enum: [requirements, design, tasks]

    SpecStageStatus:
      type: string
      enum: [not_started, in_review, approved]

    Spec:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        slug: { type: string }
        featureName: { type: string }
        requirementsOverview: { type: string }
        requirementsStageStatus: { $ref: "#/components/schemas/SpecStageStatus" }
        requirementsDeniedAt: { type: string, format: date-time, nullable: true }
        requirementsLastDenialReason: { type: string, nullable: true }
        designOverview: { type: string }
        designArchitecture: { type: string }
        designDataModelOverview: { type: string, nullable: true }
        designStageStatus: { $ref: "#/components/schemas/SpecStageStatus" }
        designDeniedAt: { type: string, format: date-time, nullable: true }
        designLastDenialReason: { type: string, nullable: true }
        tasksStageStatus:
          allOf: [ { $ref: "#/components/schemas/SpecStageStatus" } ]
          description: Derived live from every component's TasksDoc — never stored.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TasksDoc:
      type: object
      properties:
        id: { type: string }
        specId: { type: string }
        designComponentId: { type: string }
        componentSlug: { type: string }
        componentName: { type: string }
        status: { $ref: "#/components/schemas/SpecStageStatus" }
        deniedAt: { type: string, format: date-time, nullable: true }
        lastDenialReason: { type: string, nullable: true }

    ListTasksDocsResponse:
      type: object
      properties:
        tasksDocs:
          type: array
          items: { $ref: "#/components/schemas/TasksDoc" }
          description: Ordered alphabetically by componentSlug. Empty when the tasks stage hasn't started.

    NextStageInfo:
      type: object
      properties:
        nextStage:
          type: string
          enum: [requirements, design, tasks, implementation]
        laggingComponents:
          type: array
          items: { type: string }
          description: Component slugs not yet approved; only populated when nextStage is "tasks".

    RenderDocumentResponse:
      type: object
      properties:
        markdown: { type: string }

    StageActionRequest:
      type: object
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/SpecStage" }
        component:
          type: string
          description: 'Required when stage is "tasks": the design component''s slug.'
        reason:
          type: string
          description: Required for deny; ignored otherwise.

    StageActionResponse:
      type: object
      properties:
        spec:
          allOf: [ { $ref: "#/components/schemas/Spec" } ]
          nullable: true
          description: Set for stage requirements/design.
        tasksDoc:
          allOf: [ { $ref: "#/components/schemas/TasksDoc" } ]
          nullable: true
          description: Set for stage tasks.

    Handoff:
      type: object
      properties:
        id: { type: string }
        sourceWorkspaceId: { type: string }
        targetWorkspaceId: { type: string }
        title: { type: string }
        body:
          type: string
          nullable: true
          description: Populated only on single-get (GET /handoffs/{id}); omitted on list rows
        type: { type: string, enum: [bug, question, fyi, dependency-change] }
        status: { type: string, enum: [pending, read, actioned, dismissed] }
        sentBy: { type: string }
        sentAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        resolutionNote: { type: string, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/HandoffAttachment" }
          nullable: true
          description: Populated only on single-get (GET /handoffs/{id}); omitted on list rows

    HandoffAttachment:
      type: object
      properties:
        id: { type: string }
        ordinal: { type: integer }
        repoPath: { type: string }
        commitSha: { type: string }
        note: { type: string }

    HandoffConversation:
      type: object
      properties:
        id: { type: string }
        handoffId: { type: string }
        status: { type: string, enum: [active, escalated, closed_agreed, closed_by_human] }
        turnCap: { type: string, nullable: true }
        escalationReason: { type: string, nullable: true, enum: [turn_cap, tie_break, stalled_subagent, workspace_unreachable] }
        escalatedAt: { type: string, format: date-time, nullable: true }
        draftedAction: { type: string, nullable: true, enum: [action, dismiss] }
        draftedResolutionNote: { type: string, nullable: true }
        draftedAt: { type: string, nullable: true }
        arbiterSessionId: { type: string }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HandoffTurn:
      type: object
      properties:
        id: { type: string }
        conversationId: { type: string }
        turnNumber: { type: integer }
        speaker: { type: string, enum: [source, target, arbiter] }
        content: { type: string }
        verdict: { type: string, enum: [action, dismiss, more_info, blocked] }
        createdAt: { type: string, format: date-time }
