document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  font-weight: 600;\n  font-display: swap;\n  src: url(\"fe99d2e8-9ead-4023-9ac3-3464bf3862c2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"21d3a354-6449-475f-af86-6053f5a67dbd\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"74f28b51-2e5c-4c5c-b8c7-f25e8c0f34da\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fe99d2e8-9ead-4023-9ac3-3464bf3862c2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ── Rig · Color tokens ────────────────────────────────────────────\n   Cool graphite ink neutrals + signal-green brand accent (terminal phosphor).\n   Amber remains as the warning / in-review status hue.\n   Base ramps first, then semantic aliases. Consumers should prefer aliases. */\n:root {\n  /* Neutral — cool graphite (\"ink\") */\n  --ink-950: #0B0D10;\n  --ink-900: #101319;\n  --ink-850: #161A22;\n  --ink-800: #1B212B;\n  --ink-700: #262E3A;\n  --ink-600: #364150;\n  --slate-500: #55617440;\n  --slate-500-solid: #556174;\n  --slate-400: #737F92;\n  --slate-300: #9AA4B4;\n  --slate-200: #C4CBD6;\n  --slate-100: #E1E6ED;\n  --slate-50: #EFF2F6;\n  --paper: #F7F8FA;\n  --white: #FFFFFF;\n\n  /* Brand — signal green */\n  --green-100: #D8F7E5;\n  --green-200: #A8EFC7;\n  --green-300: #6FE7A6;\n  --green-400: #4AE38A;  /* dark-theme primary */\n  --green-500: #27CE74;\n  --green-600: #178A4C;  /* light-theme primary */\n  --green-700: #10693A;\n  --green-800: #0B4C2B;\n\n  /* Status — amber (warning / in-review) */\n  --amber-100: #FCEFD6;\n  --amber-200: #FADBA3;\n  --amber-300: #F6C062;\n  --amber-400: #F0A031;\n  --amber-500: #E8850C;  /* primary brand */\n  --amber-600: #C46A05;\n  --amber-700: #94500A;\n  --amber-800: #6B3B0C;\n\n  /* Semantic hues */\n  --emerald-100: #D6F5E3;\n  --emerald-500: #12A150;\n  --emerald-600: #0C8A43;\n  --emerald-700: #0A6E36;\n\n  --rose-100: #FBDDDD;\n  --rose-500: #E5484D;\n  --rose-600: #CC3438;\n  --rose-700: #A82327;\n\n  --sky-100: #D7EDFB;\n  --sky-500: #1B92E3;\n  --sky-600: #1476BD;\n  --sky-700: #0F5C94;\n\n  --violet-100: #E6E0FB;\n  --violet-500: #7059E0;\n  --violet-600: #5A45C2;\n\n  /* ── Semantic aliases (light theme = default) ────────────────────────── */\n  --bg-app: var(--paper);\n  --bg-surface: var(--white);\n  --bg-surface-2: var(--slate-50);\n  --bg-inset: var(--slate-100);\n  --bg-hover: #00000008;\n  --bg-active: #00000012;\n\n  --text-strong: var(--ink-900);\n  --text-body: var(--ink-700);\n  --text-muted: var(--slate-400);\n  --text-faint: var(--slate-300);\n  --text-inverse: var(--white);\n  --text-brand: var(--green-700);\n  --text-link: var(--green-700);\n  --text-link-hover: var(--green-800);\n\n  --border-subtle: var(--slate-100);\n  --border-default: var(--slate-200);\n  --border-strong: var(--slate-300);\n  --border-focus: var(--green-600);\n\n  --accent: var(--green-600);\n  --accent-hover: var(--green-700);\n  --accent-active: var(--green-800);\n  --accent-soft: var(--green-100);\n  --on-accent: #FFFFFF;\n\n  /* Workflow / status semantics */\n  --status-draft-fg: var(--slate-500-solid);\n  --status-draft-bg: var(--slate-100);\n  --status-review-fg: var(--amber-700);\n  --status-review-bg: var(--amber-100);\n  --status-approved-fg: var(--emerald-700);\n  --status-approved-bg: var(--emerald-100);\n  --status-denied-fg: var(--rose-700);\n  --status-denied-bg: var(--rose-100);\n  --status-running-fg: var(--sky-700);\n  --status-running-bg: var(--sky-100);\n\n  --success: var(--emerald-500);\n  --danger: var(--rose-500);\n  --info: var(--sky-500);\n  --warning: var(--amber-500);\n\n  --focus-ring: 0 0 0 3px #178A4C40;\n}\n\n/* ── Dark theme (\"ink\") ─────────────────────────────────────────────────\n   Apply to a scope via [data-theme=\"dark\"] or .theme-dark. */\n[data-theme=\"dark\"], .theme-dark {\n  --bg-app: var(--ink-950);\n  --bg-surface: var(--ink-900);\n  --bg-surface-2: var(--ink-850);\n  --bg-inset: var(--ink-800);\n  --bg-hover: #FFFFFF0A;\n  --bg-active: #FFFFFF14;\n\n  --text-strong: #F4F6FA;\n  --text-body: #C4CBD6;\n  --text-muted: #7B8698;\n  --text-faint: #556174;\n  --text-inverse: var(--ink-950);\n  --text-brand: var(--green-400);\n  --text-link: var(--green-400);\n  --text-link-hover: var(--green-300);\n\n  --border-subtle: #FFFFFF12;\n  --border-default: #FFFFFF1F;\n  --border-strong: #FFFFFF33;\n  --border-focus: var(--green-400);\n\n  --accent: var(--green-400);\n  --accent-hover: var(--green-300);\n  --accent-active: var(--green-200);\n  --accent-soft: #4AE38A1F;\n  --on-accent: #062B18;\n\n  --status-draft-fg: var(--slate-300);\n  --status-draft-bg: #FFFFFF12;\n  --status-review-fg: var(--amber-300);\n  --status-review-bg: #E8850C24;\n  --status-approved-fg: #4FD98A;\n  --status-approved-bg: #12A15024;\n  --status-denied-fg: #F58A8D;\n  --status-denied-bg: #E5484D24;\n  --status-running-fg: #5CBDF5;\n  --status-running-bg: #1B92E324;\n\n  --focus-ring: 0 0 0 3px #4AE38A40;\n}\n<\u002Fstyle>\n<style>/* ── Rig · Typography tokens ───────────────────────────────────── */\n:root {\n  --font-display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;\n  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', ui-monospace, Menlo, monospace;\n\n  /* Type scale (px) — dense, technical rhythm */\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 14px;   /* UI default */\n  --text-md: 15px;\n  --text-lg: 17px;\n  --text-xl: 20px;\n  --text-2xl: 24px;\n  --text-3xl: 30px;\n  --text-4xl: 38px;\n  --text-5xl: 48px;\n  --text-6xl: 64px;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n\n  /* Line heights */\n  --leading-tight: 1.1;\n  --leading-snug: 1.25;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.65;\n\n  /* Letter spacing */\n  --tracking-tight: -0.02em;\n  --tracking-snug: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.02em;\n  --tracking-caps: 0.08em;  /* mono eyebrows / labels */\n}\n<\u002Fstyle>\n<style>/* ── Rig · Spacing, radius, shadow, motion, layout tokens ──────── */\n:root {\n  /* Spacing — 4px base */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* Radius — tight, engineered */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 8px;\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n  --radius-2xl: 20px;\n  --radius-full: 9999px;\n\n  /* Border widths */\n  --border-hair: 1px;\n  --border-thick: 1.5px;\n\n  /* Shadows — cool graphite, subtle */\n  --shadow-xs: 0 1px 2px rgba(11,13,16,0.05);\n  --shadow-sm: 0 1px 3px rgba(11,13,16,0.08), 0 1px 2px rgba(11,13,16,0.04);\n  --shadow-md: 0 4px 12px rgba(11,13,16,0.08), 0 2px 4px rgba(11,13,16,0.04);\n  --shadow-lg: 0 12px 32 mber-300: #F6C062;\n  --amber-400: #F0A031;\n  --amber-500: #E8850C;  /* primary brand */\n  --amber-600: #C46A05;\n  --amber-700: #94500A;\n  --amber-800: #6B3B0C;\n\n  /* Semantic hues */\n  --emerald-100: #D6F5E3;\n  --emerald-500: #12A150;\n  --emerald-600: #0C8A43;\n  --emerald-700: #0A6E36;\n\n  --rose-100: #FBDDDD;\n  --rose-500: #E5484D;\n  --rose-600: #CC3438;\n  --rose-700: #A82327;\n\n  --sky-100: #D7EDFB;\n  --sky-500: #1B92E3;\n  --sky-600: #1476BD;\n  --sky-700: #0F5C94;\n\n  --violet-100: #E6E0FB;\n  --violet-500: #7059E0;\n  --violet-600: #5A45C2;\n\n  /* ── Semantic aliases (light theme = default) ────────────────────────── */\n  --bg-app: var(--paper);\n  --bg-surface: var(--white);\n  --bg-surface-2: var(--slate-50);\n  --bg-inset: var(--slate-100);\n  --bg-hover: #00000008;\n  --bg-active: #00000012;\n\n  --text-strong: var(--ink-900);\n  --text-body: var(--ink-700);\n  --text-muted: var(--slate-400);\n  --text-faint: var(--slate-300);\n  --text-inverse: var(--white);\n  --text-brand: var(--green-700);\n  --text-link: var(--green-700);\n  --text-link-hover: var(--green-800);\n\n  --border-subtle: var(--slate-100);\n  --border-default: var(--slate-200);\n  --border-strong: var(--slate-300);\n  --border-focus: var(--green-600);\n\n  --accent: var(--green-600);\n  --accent-hover: var(--green-700);\n  --accent-active: var(--green-800);\n  --accent-soft: var(--green-100);\n  --on-accent: #FFFFFF;\n\n  /* Workflow / status semantics */\n  --status-draft-fg: var(--slate-500-solid);\n  --status-draft-bg: var(--slate-100);\n  --status-review-fg: var(--amber-700);\n  --status-review-bg: var(--amber-100);\n  --status-approved-fg: var(--emerald-700);\n  --status-approved-bg: var(--emerald-100);\n  --status-denied-fg: var(--rose-700);\n  --status-denied-bg: var(--rose-100);\n  --status-running-fg: var(--sky-700);\n  --status-running-bg: var(--sky-100);\n\n  --success: var(--emerald-500);\n  --danger: var(--rose-500);\n  --info: var(--sky-500);\n  --warning: var(--amber-500);\n\n  --focus-ring: 0 0 0 3px #178A4C40;\n}\n\n/* ── Dark theme (\"ink\") ─────────────────────────────────────────────────\n   Apply to a scope via [data-theme=\"dark\"] or .theme-dark. */\n[data-theme=\"dark\"], .theme-dark {\n  --bg-app: var(--ink-950);\n  --bg-surface: var(--ink-900);\n  --bg-surface-2: var(--ink-850);\n  --bg-inset: var(--ink-800);\n  --bg-hover: #FFFFFF0A;\n  --bg-active: #FFFFFF14;\n\n  --text-strong: #F4F6FA;\n  --text-body: #C4CBD6;\n  --text-muted: #7B8698;\n  --text-faint: #556174;\n  --text-inverse: var(--ink-950);\n  --text-brand: var(--green-400);\n  --text-link: var(--green-400);\n  --text-link-hover: var(--green-300);\n\n  --border-subtle: #FFFFFF12;\n  --border-default: #FFFFFF1F;\n  --border-strong: #FFFFFF33;\n  --border-focus: var(--green-400);\n\n  --accent: var(--green-400);\n  --accent-hover: var(--green-300);\n  --accent-active: var(--green-200);\n  --accent-soft: #4AE38A1F;\n  --on-accent: #062B18;\n\n  --status-draft-fg: var(--slate-300);\n  --status-draft-bg: #FFFFFF12;\n  --status-review-fg: var(--amber-300);\n  --status-review-bg: #E8850C24;\n  --status-approved-fg: #4FD98A;\n  --status-approved-bg: #12A15024;\n  --status-denied-fg: #F58A8D;\n  --status-denied-bg: #E5484D24;\n  --status-running-fg: #5CBDF5;\n  --status-running-bg: #1B92E324;\n\n  --focus-ring: 0 0 0 3px #4AE38A40;\n}\n\n/* ── Rig · Typography tokens ───────────────────────────────────── */\n:root {\n  --font-display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;\n  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', ui-monospace, Menlo, monospace;\n\n  /* Type scale (px) — dense, technical rhythm */\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-base: 14px;   /* UI default */\n  --text-md: 15px;\n  --text-lg: 17px;\n  --text-xl: 20px;\n  --text-2xl: 24px;\n  --text-3xl: 30px;\n  --text-4xl: 38px;\n  --text-5xl: 48px;\n  --text-6xl: 64px;\n\n  /* W ───────────────────── */\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n  background: var(--bg-app);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  color: var(--text-strong);\n  font-weight: var(--weight-semibold);\n  letter-spacing: var(--tracking-tight);\n  line-height: var(--leading-tight);\n  margin: 0;\n  text-wrap: balance;\n}\n\np { margin: 0; text-wrap: pretty; }\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-standard);\n}\na:hover { color: var(--text-link-hover); }\n\ncode, kbd, pre, samp { font-family: var(--font-mono); font-size: 0.92em; }\n\n::selection { background: var(--amber-200); color: var(--ink-900); }\n\n:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-xs); }\n\n/* Mono eyebrow / label helper */\n.rl-eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--text-xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n/* ── Rig · component styles ─────────────────────────────────────\n   Interactive states (hover/active/focus/disabled) live here so components\n   stay declarative. All values reference tokens. Class prefix: rl- */\n\n/* ── Button ─────────────────────────────────────────────────────────── */\n.rl-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);font-family:var(--font-sans);font-weight:var(--weight-medium);line-height:1;white-space:nowrap;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),transform var r:var(--text-muted);margin:0;line-height:1.5\">Not started. Nothing to review yet.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;overflow:hidden\">\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-subtle)\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Stage<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px\">{{ activeStage }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-subtle)\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Agent<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px\">{{ gateAgent }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Model<\u002Fspan><x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Badge\" tone=\"accent\" hint-size=\"50px,22px\">{{ gateModel }}<\u002Fx-import><\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasOriginTrail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:14px\">\n            <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px\">Origin trail<\u002Fdiv>\n            <a sc-camel-on-click=\"{{ openOriginTrail }}\" style=\"font-family:var(--font-mono);font-size:12.5px;cursor:pointer\">{{ originTrailName }} →<\u002Fa>\n            <p style=\"font-size:12px;color:var(--text-muted);margin:6px 0 0;line-height:1.5\">Reached waypoints fed the requirements draft as its decisions transcript.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTrails }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1120px\">\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:6px\">\n      <h1 style=\"font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.02em;color:var(--text-strong);margin:0\">Wayfinder<\u002Fh1>\n      <span sc-camel-on-click=\"{{ openStatusInfo }}\" title=\"About trail statuses\" style-hover=\"color:var(--text-body);border-color:var(--border-strong)\" style=\"display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--border-default);border-radius:99px;color:var(--text-faint);cursor:pointer;flex-shrink:0\">\n        <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Icon\" name=\"info\" size=\"{{ 13 }}\" hint-size=\"13px,13px\"><\u002Fx-import>\n      <\u002Fspan>\n      <span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)\">{{ trailsMeta }}<\u002Fspan>\n      <span style=\"margin-left:auto\"><\u002Fspan>\n      <sc-if value=\"{{ hasTrails }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"display:flex;border:1px solid var(--border-default);border-radius:6px;overflow:hidden\">\n          <span sc-camel-on-click=\"{{ setBoardView }}\" style-hover=\"background:var(--bg-hover)\" style=\"display:flex;align-items:center;gap:6px;padding:5px 11px;cursor:pointer;font-family:var(--font-mono);font-size:11px;background:{{ boardTabBg }};color:{{ boardTabFg }}\">\n            <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Icon\" name=\"kanban\" size=\"{{ 13 }}\" hint-size=\"13px,13px\"><\u002Fx-import>Board<\u002Fspan>\n          <span sc-camel-on-click=\"{{ setListView }}\" style-hover=\"background:var(--bg-hover)\" style=\"display:flex;align-items:center;gap:6px;padding:5px 11px;cursor:pointer;font-family:var(--font-mono);font-size:11px;border-left:1px solid var(--border-default);background:{{ listTabBg }};color:{{ listTabFg }}\">\n            <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Icon\" name=\"list\" size=\"{{ 13 }}\" hint-size=\"13px,13px\"><\u002Fx-import>List<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ wfList }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-faint);display:flex;align-items:center;gap:5px\">\n          <kbd style=\"font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-default);border-radius:4px;padding:1px 5px;color:var(--text-muted);line-height:1.4\">↑<\u002Fkbd>\n          <kbd style=\"font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-default);border-radius:4px;padding:1px 5px;color:var(--text-muted);line-height:1.4\">↓<\u002Fkbd>\n          <span>select<\u002Fspan>\n          <kbd style=\"font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border-default);border-radius:4px;padding:1px 5px;color:var(--text-muted);line-height:1.4\">↵<\u002Fkbd>\n          <span>open<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fsc-if>\n      <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Button\" variant=\"primary\" sc-camel-on-click=\"{{ openLauncher }}\" hint-size=\"auto,34px\">New session<\u002Fx-import>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--text-muted);margin:0 0 20px;max-width:680px\">A discovery session starts as a grilling interview, charts a trail of waypoints toward a destination, and completes into a spec — created and linked in one transaction.<\u002Fp>\n    <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Dialog\" open=\"{{ statusInfoOpen }}\" sc-camel-on-close=\"{{ closeStatusInfo }}\" title=\"Trail statuses\" width=\"{{ 560 }}\" hint-size=\"0px,0px\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <p style=\"font-size:13px;color:var(--text-muted);margin:0;line-height:1.55\">A trail moves through four states, left to right on the board. Waypoints inside a trail carry their own states (<span style=\"font-family:var(--font-mono);font-size:12px\">sighted → claimed / marked → reached / bypassed<\u002Fspan>).<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline\">\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-brand)\">grilling<\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--text-body);line-height:1.5\">A discovery interview is in progress. No trail exists yet — the session's Q&amp;A produces the trailhead prompt.<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--status-review-fg)\">active<\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--text-body);line-height:1.5\">The trail is charted and waypoints are open. Agents claim waypoints and settle decisions one by one.<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-muted)\">settled<\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--text-body);line-height:1.5\">Every waypoint is reached or bypassed. The trail is ready to charter — nothing is blocking spec creation.<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--status-approved-fg)\">chartered<\u002Fspan>\n          <span style=\"font-size:12.5px;color:var(--text-body);line-height:1.5\">A spec was created from the trail and linked in one transaction. The work continues in the spec pipeline.<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--text-faint);margin:0;line-height:1.5;border-top:1px solid var(--border-subtle);padding-top:10px\">Waypoint states: <span style=\"font-family:var(--font-mono);font-size:11px\">sighted<\u002Fspan> = identified, not started · <span style=\"font-family:var(--font-mono);font-size:11px\">claimed<\u002Fspan> = an agent is working it · <span style=\"font-family:var(--font-mono);font-size:11px\">marked<\u002Fspan> = decision drafted, awaiting settle · <span style=\"font-family:var(--font-mono);font-size:11px\">reached<\u002Fspan> = decision settled · <span style=\"font-family:var(--font-mono);font-size:11px\">bypassed<\u002Fspan> = deliberately skipped.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fx-import>\n    <sc-if value=\"{{ hasLiveSessions }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ wfList }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-brand);margin-bottom:10px\">In progress<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-bottom:26px\">\n        <sc-for list=\"{{ liveSessions }}\" as=\"s\" hint-placeholder-count=\"1\">\n          <div sc-camel-on-click=\"{{ s.resume }}\" style-hover=\"border-color:var(--border-strong)\" style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:14px 16px;cursor:pointer\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n              <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-brand);white-space:nowrap\">{{ s.id }}<\u002Fspan>\n              <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap\">{{ s.typeLabel }} · {{ s.execLabel }}<\u002Fspan>\n              <span style=\"margin-left:auto;flex-shrink:0\"><x  <sc-for list=\"{{ boardCols }}\" as=\"col\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-drag-over=\"{{ col.dragOver }}\" sc-camel-on-drag-leave=\"{{ col.dragLeave }}\" sc-camel-on-drop=\"{{ col.drop }}\" style=\"background:{{ col.bg }};border:1px solid {{ col.border }};border-radius:8px;padding:10px;min-height:180px;transition:background 120ms,border-color 120ms\">\n          <div style=\"display:flex;align-items:baseline;gap:7px;padding:2px 4px 10px\">\n            <span style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;color:{{ col.fg }}\">{{ col.label }}<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint)\">{{ col.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ col.cards }}\" as=\"c\" hint-placeholder-count=\"1\">\n              <div sc-camel-on-click=\"{{ c.click }}\" draggable=\"{{ c.drag }}\" sc-camel-on-drag-start=\"{{ c.dragStart }}\" sc-camel-on-drag-end=\"{{ c.dragEnd }}\" style-hover=\"border-color:var(--border-strong)\" style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:6px;padding:11px 12px;cursor:pointer\">\n                <div style=\"display:flex;align-items:flex-start;gap:7px;margin-bottom:6px\">\n                  <span style=\"font-size:12.5px;font-weight:600;color:var(--text-strong);line-height:1.4;flex:1;min-width:0\">{{ c.title }}<\u002Fspan>\n                  <span style=\"flex-shrink:0\"><x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.StatusBadge\" status=\"{{ c.badgeS }}\" label=\"{{ c.badgeL }}\" hint-size=\"70px,20px\"><\u002Fx-import><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--text-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px\">{{ c.sub }}<\u002Fdiv>\n >\n      <span style=\"margin-left:auto\"><\u002Fspan>\n      <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.StatusBadge\" status=\"approved\" label=\"completed\" hint-size=\"96px,24px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--text-muted);margin:6px 0 20px;max-width:680px\">Stage 0. The grilling skill drives one question at a time to a usable answer; the transcript persists and seeds the trail's waypoints.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:20px;align-items:start\">\n      <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;overflow:hidden\">\n        <sc-for list=\"{{ sess.turns }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"padding:16px 20px;border-bottom:1px solid var(--border-subtle)\">\n            <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px\">Q{{ t.n }} · grilling<\u002Fdiv>\n            <div style=\"font-size:14px;font-weight:600;color:var(--text-strong);line-height:1.45;margin-bottom:10px\">{{ t.q }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-brand);margin-bottom:5px\">A · you<\u002Fdiv>\n            <p style=\"font-size:13.5px;line-height:1.6;margin:0;color:var(--text-body)\">{{ t.a }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"padding:12px 20px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)\">session finalized → trailhead prompt · {{ sess.trailId }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;position:sticky;top:0\">\n        <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;overflow:hidden\">\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-subtle)\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Session<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px\">{{ sess.id }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-subtle)\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Started<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px\">{{ sess.started }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border-subtle)\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Turns<\u002Fspan><span style=\"font-family:var(--font-mono);font-size:12px\">{{ sess.turnCount }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 14px\"><span style=\"font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)\">Stage<\u002Fspan><x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Badge\" tone=\"neutral\" hint-size=\"70px,22px\">0 · grilling<\u002Fx-import><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:14px 16px\">\n          <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px\">Fed into<\u002Fdiv>\n          <a sc-camel-on-click=\"{{ goBackTrail }}\" style=\"font-family:var(--font-mono);font-size:12.5px;cursor:pointer\">trail {{ sess.trailId }} →<\u002Fa>\n          <p style=\"font-size:12px;color:var(--text-muted);margin:6px 0 0;line-height:1.5\">Answers became the trailhead prompt; open questions became the first waypoints.<\u002Fp>\n          <sc-if value=\"{{ sess.hasSpec }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-top:1px solid var(--border-subtle);margin-top:10px;padding-top:10px\">\n              <a sc-camel-on-click=\"{{ sess.openSpec }}\" style=\"font-family:var(--font-mono);font-size:12.5px;cursor:pointer\">{{ sess.specName }} →<\u002Fa>\n              <p style=\"font-size:12px;color:var(--text-muted);margin:6px 0 0;line-height:1.5\">The trail completed into this spec.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAudit }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1120px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n      <h1 style=\"font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.02em;color:var(--text-strong);margin:0\">Audit log<\u002Fh1>\n      <span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)\">every mutation · one row · same transaction<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--text-muted);margin:0 0 16px\">Every write is attributed. <span style=\"font-family:var(--font-mono);font-size:12px\">actor<\u002Fspan> must be a registered <span style=\"font-family:var(--font-mono);font-size:12px\">known_actor<\u002Fspan>.<\u002Fp>\n    <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:70px minmax(130px,170px) minmax(110px,140px) minmax(160px,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-default);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">\n        <span>Time<\u002Fspan><span>Actor<\u002Fspan><span>Action<\u002Fspan><span>Target<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ auditRows }}\" as=\"a\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:70px minmax(130px,170px) minmax(110px,140px) minmax(160px,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-subtle);align-items:center\">\n          <span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)\">{{ a.time }}<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:{{ a.actorColor }}\">{{ a.actor }}<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-body)\">{{ a.action }}<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.target }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRuns }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1120px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n      <h1 style=\"font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-0.02em;color:var(--text-strong);margin:0\">Workflow runs<\u002Fh1>\n      <span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)\">GET /api/runs?project= · POST /api/runs/:runId/abort<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--text-muted);margin:0 0 16px\">The polling scheduler claims runnable runs and drives the interpreter node-by-node in the background.<\u002Fp>\n    <div style=\"background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:60px minmax(96px,130px) minmax(100px,1fr) minmax(58px,78px) minmax(84px,100px) minmax(52px,66px) 32px;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-default);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">\n        <span>Run<\u002Fspan><span>Workflow<\u002Fspan><span>Node<\u002Fspan><span>Executor<\u002Fspan><span>Status<\u002Fspan><span>Started<\u002Fspan><span><\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ runRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:60px minmax(96px,130px) minmax(100px,1fr) minmax(58px,78px) minmax(84px,100px) minmax(52px,66px) 32px;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-subtle);align-items:center\">\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-brand)\">{{ r.id }}<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px\">{{ r.workflow }}<\u002Fspan>\n          <div style=\"min-width:0\">\n            <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-body);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.node }}<\u002Fspan>\n            <sc-if value=\"{{ r.isRunning }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"height:2px;border-radius:99px;background:var(--bg-inset);overflow:hidden;position:relative;margin-top:5px;max-width:220px\">\n                <div style=\"position:absolute;width:36%;height:100%;background:var(--status-running-fg);border-radius:99px;animation:rl-run 1.6s linear infinite\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <span><x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Badge\" tone=\"{{ r.execTone }}\" hint-size=\"56px,22px\">{{ r.executor }}<\u002Fx-import><\u002Fspan>\n          <span><x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.StatusBadge\" status=\"{{ r.badgeS }}\" label=\"{{ r.badgeL }}\" hint-size=\"90px,22px\"><\u002Fx-import><\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint)\">{{ r.started }}<\u002Fspan>\n          <span><sc-if value=\"{{ r.canAbort }}\" hint-placeholder-val=\"{{ false }}\"><x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.IconButton\" icon=\"square\" label=\"Abort run\" sc-camel-on-click=\"{{ r.askAbort }}\" hint-size=\"28px,28px\"><\u002Fx-import><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Dialog\" open=\"{{ abortOpen }}\" sc-camel-on-close=\"{{ closeAbort }}\" title=\"Abort run\" width=\"{{ 440 }}\" hint-size=\"0px,0px\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <p style=\"font-size:13px;color:var(--text-body);margin:0;line-height:1.55\">POST <span style=\"font-family:var(--font-mono);font-size:12px\">/api/runs/{{ abortRunId }}/abort<\u002Fspan> is a new write route — it requires an <span style=\"font-family:var(--font-mono);font-size:12px\">actor<\u002Fspan>, validated against <span style=\"font-family:var(--font-mono);font-size:12px\">known_actors<\u002Fspan>, and writes the audit_log row in the same transaction.<\u002Fp>\n        <div style=\"border:1px solid var(--border-default);background:var(--bg-inset);border-radius:6px;padding:9px 12px;display:flex;align-items:baseline;gap:10px\">\n          <span style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">Actor<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-strong)\">web-ui<\u002Fspan>\n          <span style=\"font-size:11.5px;color:var(--text-faint)\">fixed — the console writes as its own registered actor<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end;gap:10px;margin-top:4px\">\n          <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Button\" sc-camel-on-click=\"{{ closeAbort }}\" hint-size=\"auto,34px\">Cancel<\u002Fx-import>\n          <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Button\" variant=\"primary\" sc-camel-on-click=\"{{ confirmAbort }}\" hint-size=\"auto,34px\">Abort run<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<div style=\"position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:50;width:340px\">\n  <sc-for list=\"{{ toasts }}\" as=\"t\">\n    <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Toast\" title=\"{{ t.title }}\" message=\"{{ t.message }}\" tone=\"{{ t.tone }}\" hint-size=\"340px,60px\"><\u002Fx-import>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ launcherOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeLauncher }}\" style=\"position:fixed;inset:0;background:rgba(11,13,16,.55);display:flex;align-items:center;justify-content:center;z-index:100\">\n    <div sc-camel-on-click=\"{{ eatClick }}\" style=\"width:540px;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);overflow:auto;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;box-shadow:var(--shadow-md, 0 12px 32px #00000088)\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-subtle)\">\n        <span style=\"font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--text-strong)\">Start a session<\u002Fspan>\n        <span style=\"font-family:var(--font-mono);font-size:11px;color:var(--text-faint)\">grilling · stage 0<\u002Fspan>\n        <span style=\"margin-left:auto\"><\u002Fspan>\n     <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">Model<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:-6px;align-items:center\">\n          <sc-for list=\"{{ lModels }}\" as=\"m\">\n            <span sc-camel-on-click=\"{{ m.pick }}\" style-hover=\"border-color:var(--border-strong)\" style=\"border:1px solid {{ m.border }};background:{{ m.bg }};border-radius:99px;padding:4px 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-strong);cursor:pointer;white-space:nowrap\">{{ m.name }}<\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"font-size:11px;color:var(--text-faint)\">{{ lModelHint }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">Project<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:-6px\">\n          <sc-for list=\"{{ lProjects }}\" as=\"o\">\n            <span sc-camel-on-click=\"{{ o.pick }}\" style-hover=\"border-color:var(--border-strong)\" style=\"border:1px solid {{ o.border }};background:{{ o.bg }};border-radius:99px;padding:4px 12px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-strong);cursor:pointer;white-space:nowrap\">{{ o.name }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">Seed prompt<\u002Fdiv>\n        <div style=\"margin-top:-6px\">\n          <x-import component-from-global-scope=\"RelentlessDesignSystem_81cf11.Textarea\" value=\"{{ lSeed }}\" sc-camel-on-change=\"{{ setLSeed }}\" placeholder=\"The loose idea — what should exist that does not?\" rows=\"{{ 3 }}\" hint-size=\"100%,80px\"><\u002Fx-import>\n
